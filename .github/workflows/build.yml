name: Build OwnInvoice Desktop

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # A failing macOS CI build must not cancel the Windows build that the
      # release depends on.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build React app
      run: npm run build
      env:
        # Actions sets CI=true, which makes react-scripts promote every ESLint
        # warning into a build error. The tree has pre-existing warnings, so
        # keep this off until they are cleaned up.
        CI: false

    - name: Build Electron app (macOS)
      if: matrix.platform == 'mac'
      run: npx electron-builder --mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Build Electron app (Windows)
      if: matrix.platform == 'win'
      run: npx electron-builder --win --x64

    - name: Upload macOS DMG
      if: matrix.platform == 'mac'
      uses: actions/upload-artifact@v4
      with:
        name: OwnInvoice-macOS
        path: dist/*.dmg

    - name: Upload Windows Installer
      if: matrix.platform == 'win'
      uses: actions/upload-artifact@v4
      with:
        name: OwnInvoice-Windows
        path: dist/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    # Run even if the (unused-for-release) macOS build fails
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    # Only the Windows installer is attached here. CI macOS builds are unsigned
    # and un-notarized (CSC_IDENTITY_AUTO_DISCOVERY: false), so the DMGs are
    # built and notarized locally and uploaded to the release by hand.
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OwnInvoice-Windows/*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
